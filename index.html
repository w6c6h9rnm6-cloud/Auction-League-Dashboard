const avg = (arr) => {
  const v = arr.filter((x) => x !== null && x !== undefined);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
};
const seasonsPlayed = (o) => o.finishes.filter((x) => x !== null && x !== undefined).length;

function sprayOutline(topColor, bottomColor) {
  return {
    backgroundImage: `linear-gradient(180deg, ${topColor} 0%, ${bottomColor} 100%)`,
    WebkitBackgroundClip: "text",
    backgroundClip: "text",
    color: "transparent",
    WebkitTextStroke: "4px #000",
    textShadow: `4px 4px 0 #000, 7px 7px 0 rgba(0,0,0,0.75)`,
  };
}

// renders a word as individually-jittered letters -- rotation, vertical offset,
// and slight size variance per letter -- to fake hand-tagged wildstyle irregularity
// instead of one static font stamping out identical, evenly-spaced glyphs.
function GraffitiWord({ word, topColor, bottomColor, baseSize, seed = 0 }) {
  return (
    <span style={{ display: "inline-flex", flexWrap: "nowrap" }}>
      {word.split("").map((ch, i) => {
        const k = (i + seed) * 41;
        const rot = ((k % 15) - 7) * 1.4;
        const dy = ((k * 3) % 13) - 6;
        const scale = 1 + (((k * 7) % 10) - 5) / 100;
        return (
          <span
            key={i}
            style={{
              display: "inline-block",
              fontSize: baseSize,
              transform: `rotate(${rot}deg) translateY(${dy}px) scale(${scale})`,
              marginRight: ch === " " ? 14 : -2,
              ...sprayOutline(topColor, bottomColor),
            }}
          >
            {ch === " " ? "\u00A0" : ch}
          </span>
        );
      })}
    </span>
  );
}

// irregular paint-splatter blob, CSS-only (organic border-radius trick)
function SplatBlob({ style, color = PURPLE }) {
  return (
    <div style={{
      position: "absolute",
      borderRadius: "58% 42% 55% 45% / 45% 55% 40% 60%",
      background: color,
      ...style,
    }} />
  );
}

      if (bv === null || bv === undefined) bv = sortDir === "asc" ? Infinity : -Infinity;
      if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);

                {section.title}
              </h3>
              <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                {section.items.map((item, i) => {
                  const isObj = typeof item === "object";
                  const text = isObj ? item.text : item;
                  const sub = isObj ? item.sub : null;
                  return (
                    <li key={i} style={{ marginBottom: 12 }}>
                      <div style={{ display: "flex", gap: 10 }}>
                        <span style={{ color: PURPLE, flexShrink: 0 }}>&#9670;</span>
                        <span style={{ fontSize: 14, lineHeight: 1.6, color: CHALK }}>{text}</span>
                      </div>
                      {sub && (
                        <ul style={{ margin: "8px 0 0 24px", padding: 0, listStyle: "none" }}>
                          {sub.map((s, j) => (
                            <li key={j} style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                              <span className="mono" style={{ color: MUTED, flexShrink: 0, fontSize: 11 }}>&rarr;</span>
                              <span className="mono" style={{ fontSize: 12, lineHeight: 1.6, color: MUTED }}>{s}</span>
                            </li>
                          ))}
                        </ul>
                      )}
                    </li>
                  );
                })}
              </ul>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SectionLabel({ n, title, sub, color }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 16 }}>
      <span className="spray" style={{
        color, fontSize: 20, WebkitTextStroke: "1px rgba(0,0,0,0.5)", transform: "rotate(-2deg)", display: "inline-block",
      }}>{n}</span>
      <h2 className="street" style={{ margin: 0, fontSize: 24, fontWeight: 400, textTransform: "uppercase", letterSpacing: 0.5 }}>{title}</h2>
      {sub && <span style={{ fontSize: 12, color: MUTED }}>&mdash; {sub}</span>}
    </div>
  );
}

function Th({ onClick, label, sortKey, active, align }) {
  return (
    <th onClick={onClick} style={{
      padding: "10px 12px", fontWeight: 500, letterSpacing: 1, textTransform: "uppercase", fontSize: 11,
      color: active === sortKey ? GREEN : MUTED,
      textAlign: align || "left",
    }}>
      {label}
      <span style={{ opacity: active === sortKey ? 1 : 0.25, marginLeft: 4, fontSize: 10 }}>
        {active === sortKey ? "\u25B2" : "\u25BC"}
      </span>
    </th>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<LeagueHistory />);
</script>
</body>
</html>
